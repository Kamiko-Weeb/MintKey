name: Build Mintkey

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller PyQt6 requests python-dotenv pyautogui

      - name: Build Mac app
        run: |
          pyinstaller --onefile --windowed --icon=mintkey.icns --name=Mintkey AutoTyper.py

      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mintkey-Mac
          path: dist/Mintkey.app

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller PyQt6 requests python-dotenv pyautogui

      - name: Build Windows exe
        run: |
          pyinstaller --onefile --windowed --name=Mintkey AutoTyper.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mintkey-Windows
          path: dist/Mintkey.exe
